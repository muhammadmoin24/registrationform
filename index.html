<!DOCTYPE html>
<html>
<head>
    <title>Complete Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <!-- Text -->
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name">
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <!-- Password -->
        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <!-- Phone -->
        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="03XXXXXXXXX">
        <br><br>

        <!-- Number -->
        <label>Age:</label>
        <input type="number" name="age" min="1" max="100">
        <br><br>

        <!-- Date -->
        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <!-- Time -->
        <label>Preferred Time:</label>
        <input type="time" name="time">
        <br><br>

        <!-- Date and Time -->
        <label>Appointment:</label>
        <input type="datetime-local" name="appointment">
        <br><br>

        <!-- Month -->
        <label>Birth Month:</label>
        <input type="month" name="month">
        <br><br>

        <!-- Week -->
        <label>Study Week:</label>
        <input type="week" name="week">
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>

        <!-- Checkbox -->
        <label>Hobbies:</label>
        <br>
        <input type="checkbox" name="hobby" value="cricket"> Cricket
        <input type="checkbox" name="hobby" value="reading"> Reading
        <input type="checkbox" name="hobby" value="gaming"> Gaming
        <input type="checkbox" name="hobby" value="coding"> Coding
        <br><br>

        <!-- Dropdown -->
        <label>Course:</label>
        <select name="course">
            <option value="">-- Select Course --</option>
            <option>Computer Science</option>
            <option>Web Development</option>
            <option>Graphic Design</option>
            <option>Information Technology</option>
            <option>Data Science</option>
        </select>
        <br><br>

        <!-- Multiple Select -->
        <label>Select Subjects:</label>
        <select name="subjects" multiple>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
            <option>Database</option>
        </select>
        <br><br>

        <!-- Textarea -->
        <label>Address:</label>
        <br>
        <textarea name="address" rows="4" cols="40"
        placeholder="Enter your address"></textarea>
        <br><br>

        <!-- File -->
        <label>Upload Photo:</label>
        <input type="file" name="photo">
        <br><br>

        <!-- Color -->
        <label>Favorite Color:</label>
        <input type="color" name="color">
        <br><br>

        <!-- Range -->
        <label>Skill Level:</label>
        <input type="range" name="skill" min="0" max="100">
        <br><br>

        <!-- URL -->
        <label>Website:</label>
        <input type="url" name="website" placeholder="https://example.com">
        <br><br>

        <!-- Search -->
        <label>Search:</label>
        <input type="search" name="search" placeholder="Search here">
        <br><br>

        <!-- Hidden -->
        <input type="hidden" name="student_id" value="12345">

        <!-- Readonly -->
        <label>Country:</label>
        <input type="text" value="Pakistan" readonly>
        <br><br>

        <!-- Disabled -->
        <label>Student Status:</label>
        <input type="text" value="Registered" disabled>
        <br><br>

        <!-- Required -->
        <label>CNIC:</label>
        <input type="text" name="cnic"
        placeholder="XXXXX-XXXXXXX-X" required>
        <br><br>

        <!-- Submit -->
        <input type="submit" value="Register">

        <!-- Reset -->
        <input type="reset" value="Clear Form">

        <input type="button" value="Click Me
